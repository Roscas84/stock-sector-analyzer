<!DOCTYPE html>
<html>
<head>
    <title>Test History Feature</title>
</head>
<body>
    <script src="http://localhost:3000/db-manager.js"></script>
    <script src="http://localhost:3000/filters.js"></script>
    <script>
        async function testHistoryFeature() {
            console.log('Starting history feature test...');
            
            // Step 1: Init DB
            await initDB();
            console.log('✅ DB initialized');
            
            // Step 2: Create mock analysis
            const mockCompanies = [
                { ticker: 'TEST1', name: 'Test Company 1', price: 100, level1Score: 80, level2Score: 75, level1Pass: true, level2Pass: true },
                { ticker: 'TEST2', name: 'Test Company 2', price: 200, level1Score: 70, level2Score: 85, level1Pass: true, level2Pass: true }
            ];
            
            // Step 3: Save analysis
            const analysis = await saveAnalysis('TestMarket', mockCompanies);
            console.log(`✅ Analysis saved with ID: ${analysis.id}`);
            
            // Step 4: Retrieve analysis
            const analyses = await getAnalysesByMarket('TestMarket');
            console.log(`✅ Retrieved ${analyses.length} analyses for TestMarket`);
            
            if (analyses.length > 0) {
                console.log(`   - Latest: ${analyses[0].id}`);
                console.log(`   - Companies: ${analyses[0].companies.length}`);
                console.log(`   - Timestamp: ${analyses[0].timestamp}`);
            }
            
            // Step 5: Save another analysis with slight changes
            const mockCompanies2 = [
                { ticker: 'TEST1', name: 'Test Company 1', price: 105, level1Score: 85, level2Score: 80, level1Pass: true, level2Pass: true },
                { ticker: 'TEST3', name: 'Test Company 3', price: 150, level1Score: 75, level2Score: 90, level1Pass: true, level2Pass: true }
            ];
            
            await new Promise(r => setTimeout(r, 100)); // small delay
            const analysis2 = await saveAnalysis('TestMarket', mockCompanies2);
            console.log(`✅ Second analysis saved with ID: ${analysis2.id}`);
            
            // Step 6: Get both analyses
            const allAnalyses = await getAnalysesByMarket('TestMarket');
            console.log(`✅ Total analyses for TestMarket: ${allAnalyses.length}`);
            
            // Step 7: Compare analyses
            if (allAnalyses.length >= 2) {
                const comparison = compareAnalyses(allAnalyses[1], allAnalyses[0]); // older vs newer
                console.log('✅ Comparison results:');
                console.log(`   - New entries: ${comparison.newEntries.length}`);
                console.log(`   - Exited entries: ${comparison.exitedEntries.length}`);
                console.log(`   - Improved: ${comparison.improved.length}`);
                console.log(`   - Declined: ${comparison.declined.length}`);
                console.log(`   - Net change: ${comparison.netChange}`);
                
                if (comparison.newEntries.length > 0) {
                    console.log(`   - New company: ${comparison.newEntries[0].ticker}`);
                }
                if (comparison.exitedEntries.length > 0) {
                    console.log(`   - Exited company: ${comparison.exitedEntries[0].ticker}`);
                }
            }
            
            // Step 8: Delete analysis
            await deleteAnalysis(analysis.id);
            console.log(`✅ Analysis deleted: ${analysis.id}`);
            
            const finalAnalyses = await getAnalysesByMarket('TestMarket');
            console.log(`✅ Final count for TestMarket: ${finalAnalyses.length}`);
            
            console.log('\n🎉 ALL TESTS PASSED');
        }
        
        // Run tests
        window.addEventListener('load', () => {
            testHistoryFeature().catch(err => {
                console.error('❌ Test failed:', err);
            });
        });
    </script>
</body>
</html>
