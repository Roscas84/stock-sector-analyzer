<!DOCTYPE html>
<html>
<head>
    <title>Verificar Stock Analyzer</title>
    <!-- Mismos imports que analyzer.html -->
    <script src="db-manager.js"></script>
    <script src="filters.js"></script>
    <script src="ui-common.js"></script>
    <script src="level1-handler.js"></script>
    <script src="level2-handler.js"></script>
    <script src="level3-handler.js"></script>
    <script src="history-handler.js"></script>

    <style>
        body { font-family: monospace; background: #0f172a; color: white; padding: 20px; }
        pre { background: #1e293b; padding: 15px; border-radius: 6px; overflow-x: auto; max-height: 600px; white-space: pre-wrap; }
        .error { color: #ef4444; }
        .success { color: #4ade80; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
    <h1>📊 Verificando Stock Analyzer...</h1>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        const lines = [];

        function log(msg) {
            lines.push(msg);
            output.textContent = lines.join('\n');
            window.scrollTo(0, document.body.scrollHeight);
        }

        log('🔍 Estado de carga:\n');

        // Verificar inmediatamente qué está disponible
        log('📦 Verificando módulos:');

        if (typeof initDB !== 'undefined') {
            log('  ✅ db-manager.js cargado (initDB disponible)');
        } else {
            log('  ❌ db-manager.js NO cargado');
        }

        if (typeof evaluateLevel1 !== 'undefined') {
            log('  ✅ filters.js cargado (evaluateLevel1 disponible)');
        } else {
            log('  ❌ filters.js NO cargado');
        }

        if (typeof loadAppData !== 'undefined') {
            log('  ✅ ui-common.js cargado (loadAppData disponible)');
        } else {
            log('  ❌ ui-common.js NO cargado');
        }

        if (typeof showMarketAnalysis !== 'undefined') {
            log('  ✅ level1-handler.js cargado (showMarketAnalysis disponible)');
        } else {
            log('  ❌ level1-handler.js NO cargado');
        }

        if (typeof refineLevel2 !== 'undefined') {
            log('  ✅ level2-handler.js cargado (refineLevel2 disponible)');
        } else {
            log('  ❌ level2-handler.js NO cargado');
        }

        if (typeof showRanking !== 'undefined') {
            log('  ✅ level3-handler.js cargado (showRanking disponible)');
        } else {
            log('  ❌ level3-handler.js NO cargado');
        }

        if (typeof showHistory !== 'undefined') {
            log('  ✅ history-handler.js cargado (showHistory disponible - MEJORA #5)');
        } else {
            log('  ❌ history-handler.js NO cargado');
        }

        log('\n🎨 DOM:');
        const appDiv = document.getElementById('app');
        if (appDiv) {
            log('  ✅ div#app existe');
        } else {
            log('  ❌ div#app NO EXISTE');
        }

        log('\n⏳ Esperando window.load...\n');

        window.addEventListener('load', () => {
            log('✅ window.load disparado\n');

            log('🔍 Recheck después de load:');
            if (typeof showStart !== 'undefined') {
                log('  ✅ showStart disponible');
            } else {
                log('  ❌ showStart NO disponible');
            }

            if (typeof selectMarket !== 'undefined') {
                log('  ✅ selectMarket disponible');
            } else {
                log('  ❌ selectMarket NO disponible');
            }

            const appDiv = document.getElementById('app');
            if (appDiv && appDiv.innerHTML && appDiv.innerHTML.length > 0) {
                log(`  ✅ div#app tiene contenido (${appDiv.innerHTML.length} chars)`);
                log(`  Primer HTML: ${appDiv.innerHTML.substring(0, 80)}...`);
            } else {
                log('  ❌ div#app vacío o no renderizado');
            }

            log('\n📊 Data:');
            if (typeof appData !== 'undefined' && appData) {
                log('  ✅ appData disponible');
                if (appData.markets) {
                    const markets = Object.keys(appData.markets);
                    log(`  ✅ Mercados: ${markets.join(', ')}`);
                }
            } else {
                log('  ❌ appData no está disponible');
            }

            log('\n✅ VERIFICACIÓN COMPLETADA');
        });

        // Capturar errores
        window.addEventListener('error', (e) => {
            log(`\n❌ ERROR: ${e.message}`);
            log(`   Archivo: ${e.filename}:${e.lineno}`);
        });

        window.addEventListener('unhandledrejection', (e) => {
            log(`\n❌ PROMISE REJECTION: ${e.reason}`);
        });
    </script>
</body>
</html>
