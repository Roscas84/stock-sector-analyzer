<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Analyzer - Real Data</title>
    <!-- PWA Meta Tags -->
    <meta name="description" content="Análisis masivo de acciones por sectores con filtrado inteligente" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stock Analyzer" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23059669' width='100' height='100'/><text x='50' y='60' font-size='60' fill='white' text-anchor='middle'>📊</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23059669' width='180' height='180' rx='40'/><text x='90' y='105' font-size='90' fill='white' text-anchor='middle'>📊</text></svg>" />
    <!-- ✅ NUEVA MEJORA: Módulos separados para mejor mantenibilidad -->
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="db-manager.js"></script>
    <script src="filters.js"></script>
    <script src="ui-common.js"></script>
    <script src="level1-handler.js"></script>
    <script src="level2-handler.js"></script>
    <script src="level2.3-handler.js"></script>
    <script src="level2.5-handler.js"></script>
    <script src="level2.7-handler.js"></script>
    <script src="level3-handler.js"></script>
    <script src="level3.5-handler.js"></script>
    <script src="history-handler.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            overflow-x: hidden;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #4ade80; font-size: 32px; margin-bottom: 10px; }
        h2 { color: #60a5fa; font-size: 20px; margin: 20px 0 15px 0; }
        p { color: #cbd5e1; font-size: 14px; margin-bottom: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .selector-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        select {
            background: #1e293b;
            color: white;
            padding: 10px 15px;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        select:hover { border-color: #60a5fa; }

        .company-card {
            background: #1e293b;
            border-left: 3px solid #60a5fa;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .company-card:hover { background: #334155; border-left-color: #4ade80; }

        .company-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ticker { font-weight: bold; color: #4ade80; font-size: 16px; }
        .price { color: #fbbf24; font-size: 14px; font-weight: bold; }
        .company-name { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat {
            background: #0f172a;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }
        .stat-label { color: #94a3b8; display: block; margin-bottom: 2px; }
        .stat-value { color: #4ade80; font-weight: bold; display: block; }

        .semafor { display: inline-block; margin-right: 8px; }
        .level-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            background: #334155;
            border-radius: 12px;
            margin-right: 8px;
        }

        button {
            background: #10b981;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:hover { background: #059669; }
        .back-btn { background: #6b7280; margin-right: 10px; }
        .back-btn:hover { background: #4b5563; }
        .filter-btn { background: #8b5cf6; }
        .filter-btn:hover { background: #7c3aed; }

        .results-container {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            padding-right: 10px;
        }
        .results-container::-webkit-scrollbar { width: 8px; }
        .results-container::-webkit-scrollbar-track { background: #0f172a; }
        .results-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .results-container::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Action Bar - Sticky buttons para navegación rápida */
        .action-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #0f172a 0%, #0f172a 85%, rgba(15, 23, 42, 0.95) 100%);
            padding: 12px 0;
            margin: 0 -20px 20px -20px;
            padding: 12px 20px;
            z-index: 100;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .action-bar button {
            padding: 8px 14px;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
            max-width: 100%;
        }

        .divider {
            height: 1px;
            background: #334155;
            margin: 20px 0;
        }

        .summary-box {
            background: #1e293b;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #4ade80;
            font-weight: 600;
        }

        /* Media queries para móvil */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .header { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 24px; }
            .company-card { padding: 12px; }
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); }
            .stat { font-size: 10px; padding: 4px; }

            .action-bar {
                margin: 0 -15px 15px -15px;
                padding: 10px 15px;
                flex-direction: column;
                gap: 8px;
            }

            .action-bar button {
                width: 100%;
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 10px; }
            h1 { font-size: 20px; }
            h2 { font-size: 16px; }
            .company-card { padding: 10px; margin-bottom: 8px; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .stat { font-size: 9px; padding: 3px; }

            .action-bar {
                margin: 0 -10px 12px -10px;
                padding: 8px 10px;
                gap: 6px;
            }

            .action-bar button {
                padding: 8px 10px;
                font-size: 11px;
                min-width: 100px;
            }

            button { padding: 8px 12px; font-size: 12px; }
        }

        .summary-box {
            background: #1e293b;
            padding: 12px;
            border-left: 3px solid #4ade80;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 13px;
        }

        .start-screen { text-align: center; padding: 60px 20px; }
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .market-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            padding: 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .market-btn:hover { transform: translateY(-2px); }

        .divider { height: 1px; background: #334155; margin: 20px 0; }
        .no-results { text-align: center; padding: 40px 20px; color: #94a3b8; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 8px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .modal-content h2 { margin-top: 0; }
        .close-modal { background: #ef4444; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="modal" class="modal"></div>

    <script>
        let appData = null;
        let currentMarket = null;
        let filterLevel = 1;
        let displayedCompanies = [];

        // Cargar datos
        async function loadData() {
            try {
                const response = await fetch('./data.json');
                appData = await response.json();
                showStart();
            } catch (error) {
                console.error('Error cargando datos:', error);
                document.getElementById('app').innerHTML = `<div class="container"><p style="color: #ef4444;">Error: No se pudieron cargar los datos. Verifica que data.json existe.</p></div>`;
            }
        }

        function evaluateLevel1(c) {
            let passed = 0;
            if (c.debtToEquity < 1.5) passed++;
            if (c.netProfitMargin > 5) passed++;
            if (c.revenueGrowthYoY > 5) passed++;
            if (c.currentRatio > 1.0) passed++;
            if (c.peRatio < c.sectorAvgPE) passed++;
            return { passed: passed >= 4, score: Math.round((passed / 5) * 100) };
        }

        function evaluateLevel2(c) {
            if (!c.level1Pass) return { passed: false, score: 0 };
            let passed = 0;
            let totalCriteria = 0;

            // ROE (Return on Equity): solo contar si está disponible (> 0)
            if (c.roic > 0) {
                if (c.roic > 10) passed++;
                totalCriteria++;
            }

            // Op Margin: siempre contar
            if (c.operatingMarginTrend === 'up' || c.operatingMarginTrend === 'flat') passed++;
            totalCriteria++;

            // FCF: siempre contar
            if (c.freeCashFlow > 0) passed++;
            totalCriteria++;

            // Quick Ratio: liquidez inmediata (> 1.0 = puede pagar deudas corto plazo)
            if (c.quickRatio > 0) {
                if (c.quickRatio > 1.0) passed++;
                totalCriteria++;
            }

            // Requiere al menos 2/3 si faltan datos
            const requiredPassing = totalCriteria >= 4 ? 3 : 2;
            return { passed: passed >= requiredPassing, score: Math.round((passed / Math.max(totalCriteria, 3)) * 100) };
        }

        function evaluateLevel3(c) {
            let passed = 0;
            if (c.roic > 10) passed++;
            if (c.freeCashFlow > 0) passed++;
            if (c.dividendYield > 1) passed++;
            if (c.operatingMarginTrend === 'up') passed++;
            if (c.debtTrend === 'down') passed++;
            if (c.competitiveness === 'dominant' || c.competitiveness === 'strong') passed++;
            return Math.round((passed / 6) * 100);
        }

        function getPEGRatio(c) {
            return c.revenueGrowthYoY > 0 ? c.peRatio / c.revenueGrowthYoY : c.peRatio;
        }

        function getValuationStatus(peg) {
            if (peg < 1.0) return '🟢 BARATA';
            if (peg <= 2.0) return '🟡 JUSTA';
            return '🔴 CARA';
        }

        window.showStart = function() {
            const html = `
                <div class="container start-screen">
                    <h1>📊 Stock Analyzer</h1>
                    <p style="font-size: 16px; margin-bottom: 10px;">Datos Reales • Yahoo Finance • USD</p>
                    <p style="color: #94a3b8;">3 Bolsas • 9 Criterios • Filtrado Automático</p>
                    <div class="market-grid">
                        <button class="market-btn" onclick="selectMarket('Mexico')">🇲🇽 México (BMV)</button>
                        <button class="market-btn" onclick="selectMarket('Brazil')">🇧🇷 Brasil (B3)</button>
                        <button class="market-btn" onclick="selectMarket('USA')">🇺🇸 USA (NYSE/NASDAQ)</button>
                    </div>
                    <div style="margin-top: 40px; border-top: 1px solid #334155; padding-top: 30px;">
                        <p style="color: #94a3b8; margin-bottom: 15px;">📜 Ver historial de análisis anteriores</p>
                        <div class="market-grid">
                            <button class="market-btn" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);" onclick="showHistory('Mexico')">📊 México</button>
                            <button class="market-btn" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);" onclick="showHistory('Brazil')">📊 Brasil</button>
                            <button class="market-btn" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);" onclick="showHistory('USA')">📊 USA</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        };

        window.selectMarket = function(market) {
            currentMarket = market;
            filterLevel = 1;
            showMarketAnalysis();
        };

        function showMarketAnalysis() {
            const marketData = appData.markets[currentMarket];
            const allCompanies = marketData.companies;

            // Evaluar Nivel 1
            const withLevel1 = allCompanies.map(c => {
                const l1 = evaluateLevel1(c);
                return { ...c, level1Pass: l1.passed, level1Score: l1.score };
            });

            // SOLO mostrar verdes en Nivel 1
            const greenOnly = withLevel1.filter(c => c.level1Pass);
            const greenCount = greenOnly.length;
            const sorted = greenOnly.slice().sort((a, b) => b.level1Score - a.level1Score);
            displayedCompanies = sorted;

            let html = `
                <div class="container">
                    <div class="header">
                        <div>
                            <h1>${marketData.flag} ${currentMarket}</h1>
                            <p>Nivel 1: 5 Criterios Básicos</p>
                        </div>
                        <button class="back-btn" onclick="showStart()">← Inicio</button>
                    </div>
                    <div class="divider"></div>

                    <div class="summary-box">
                        <strong>${greenCount}</strong> empresas 🟢 pasaron Nivel 1
                    </div>

                    <div class="action-bar">
                        <button class="back-btn" onclick="showStart()" style="flex:1">← Cambiar Mercado</button>
                        <button class="filter-btn" onclick="refineLevel2()" style="flex:2">✨ Siguiente: Nivel 2 (L2) →</button>
                    </div>

                    <div class="results-container">
            `;

            sorted.forEach(c => {
                const peg = getPEGRatio(c);
                html += `
                    <div class="company-card" onclick="showDetails(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                        <div class="company-header">
                            <span>
                                <span class="semafor">🟢</span>
                                <span class="ticker">${c.ticker}</span>
                            </span>
                            <span class="price">$${c.price.toFixed(2)} USD</span>
                        </div>
                        <div class="company-name">${c.name}</div>
                        <div class="stats-grid">
                            <div class="stat"><span class="stat-label">Score</span><span class="stat-value">${c.level1Score}%</span></div>
                            <div class="stat"><span class="stat-label">D/E</span><span class="stat-value">${c.debtToEquity.toFixed(2)}</span></div>
                            <div class="stat"><span class="stat-label">Margin</span><span class="stat-value">${c.netProfitMargin.toFixed(1)}%</span></div>
                            <div class="stat"><span class="stat-label">Growth</span><span class="stat-value">${c.revenueGrowthYoY.toFixed(1)}%</span></div>
                            <div class="stat"><span class="stat-label">P/E</span><span class="stat-value">${c.peRatio.toFixed(1)}</span></div>
                            <div class="stat"><span class="stat-label">PEG</span><span class="stat-value">${peg.toFixed(2)}</span></div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="divider"></div>
                    <div class="action-bar" style="margin-top: 20px; margin-bottom: 0;">
                        <button class="back-btn" onclick="showStart()" style="flex:1">← Cambiar Mercado</button>
                        <button class="filter-btn" onclick="refineLevel2()" style="flex:2">✨ Siguiente: Nivel 2 (L2) →</button>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        window.refineLevel2 = function() {
            const marketData = appData.markets[currentMarket];
            const greenOnly = displayedCompanies.filter(c => c.level1Pass);

            if (greenOnly.length === 0) {
                alert('Sin empresas verdes en Nivel 1');
                return;
            }

            // Evaluar Nivel 2
            const withLevel2 = greenOnly.map(c => {
                const l2 = evaluateLevel2(c);
                return { ...c, level2Pass: l2.passed, level2Score: l2.score };
            });

            const refined = withLevel2.filter(c => c.level2Pass);
            const sorted = refined.slice().sort((a, b) => b.level2Score - a.level2Score);
            displayedCompanies = sorted;
            filterLevel = 2;

            let html = `
                <div class="container">
                    <div class="header">
                        <div>
                            <h1>Nivel 2: Refinamiento</h1>
                            <p>Solo verdes (4 criterios avanzados)</p>
                        </div>
                        <button class="back-btn" onclick="showMarketAnalysis()">← Nivel 1</button>
                    </div>
                    <div class="divider"></div>

                    <div class="summary-box">
                        <strong>${refined.length}</strong> empresas saludables encontradas
                    </div>

                    <div class="action-bar">
                        <button class="back-btn" onclick="showMarketAnalysis()">← Volver a Nivel 1</button>
                        <button class="filter-btn" onclick="showRanking()" style="flex:2">🏆 Siguiente: Oportunidades (L3) →</button>
                    </div>

                    <div class="results-container">
            `;

            sorted.forEach(c => {
                html += `
                    <div class="company-card" onclick="showDetails(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                        <div class="company-header">
                            <span>
                                <span class="semafor">🟢</span>
                                <span class="ticker">${c.ticker}</span>
                            </span>
                            <span class="price">$${c.price.toFixed(2)} USD</span>
                        </div>
                        <div class="company-name">${c.name}</div>
                        <div class="stats-grid">
                            <div class="stat"><span class="stat-label">Score</span><span class="stat-value">${c.level2Score}%</span></div>
                            <div class="stat"><span class="stat-label">ROE</span><span class="stat-value">${c.roic.toFixed(1)}%</span></div>
                            <div class="stat"><span class="stat-label">FCF</span><span class="stat-value">${(c.freeCashFlow / 1e9).toFixed(1)}B</span></div>
                            <div class="stat"><span class="stat-label">Quick</span><span class="stat-value">${c.quickRatio ? c.quickRatio.toFixed(2) : '—'}</span></div>
                            <div class="stat"><span class="stat-label">Margin</span><span class="stat-value">${c.operatingMarginTrend}</span></div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="divider"></div>
                    <div class="action-bar" style="margin-top: 20px; margin-bottom: 0;">
                        <button class="back-btn" onclick="showMarketAnalysis()" style="flex:1">← Volver a Nivel 1</button>
                        <button class="filter-btn" onclick="showRanking()" style="flex:2">🏆 Siguiente: Oportunidades (L3) →</button>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        window.showRanking = function() {
            const ranked = displayedCompanies.map(c => {
                const l3Score = evaluateLevel3(c);
                const finalScore = Math.round((c.level1Score * 0.4) + (c.level2Score * 0.4) + (l3Score * 0.2));
                const peg = getPEGRatio(c);
                return { ...c, l3Score, finalScore, peg, valuation: getValuationStatus(peg) };
            });

            const cheapOnes = ranked.filter(c => c.peg < 1.0).sort((a, b) => b.finalScore - a.finalScore);

            let html = `
                <div class="container">
                    <div class="header">
                        <div>
                            <h1>🏆 Oportunidades de Compra</h1>
                            <p>BARATAS + Saludables (PEG < 1.0)</p>
                        </div>
                        <button class="back-btn" onclick="refineLevel2()">← Nivel 2</button>
                    </div>
                    <div class="divider"></div>
            `;

            if (cheapOnes.length === 0) {
                html += `
                    <div class="summary-box" style="border-left-color:#ca8a04">
                        <p style="color:#fbbf24">⏳ Sin Oportunidades Baratas</p>
                        <p style="font-size:12px;color:#94a3b8">No hay empresas con PEG < 1.0. Espera a que caigan.</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="summary-box">
                        <strong>${cheapOnes.length}</strong> oportunidades de compra detectadas
                    </div>

                    <div class="results-container">
                `;

                let position = 1;
                cheapOnes.forEach((c, idx) => {
                    if (idx > 0 && cheapOnes[idx - 1].finalScore !== c.finalScore) {
                        position = idx + 1;
                    }

                    html += `
                        <div class="company-card" onclick="showDetails(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                            <div class="company-header">
                                <span>
                                    <span style="color:#fbbf24;font-weight:bold;margin-right:8px">#${position}</span>
                                    <span class="ticker">${c.ticker}</span>
                                </span>
                                <span style="color:#4ade80">🟢 BARATA</span>
                            </div>
                            <div class="company-name">${c.name}</div>
                            <div class="stats-grid">
                                <div class="stat"><span class="stat-label">Score</span><span class="stat-value">${c.finalScore}%</span></div>
                                <div class="stat"><span class="stat-label">L3</span><span class="stat-value">${c.l3Score}%</span></div>
                                <div class="stat"><span class="stat-label">PEG</span><span class="stat-value">${c.peg.toFixed(2)}</span></div>
                                <div class="stat"><span class="stat-label">P/E</span><span class="stat-value">${c.peRatio.toFixed(1)}</span></div>
                                <div class="stat"><span class="stat-label">Price</span><span class="stat-value">$${c.price.toFixed(2)}</span></div>
                            </div>
                        </div>
                    `;
                });

                html += `
                    </div>
                `;
            }

            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        window.showDetails = function(company) {
            if (!company) return;

            const l1 = { passed: company.level1Pass, score: company.level1Score };
            const l2 = { passed: company.level2Pass, score: company.level2Score };
            const l3 = company.l3Score || evaluateLevel3(company);
            const peg = company.peg || getPEGRatio(company);
            const valuation = company.valuation || getValuationStatus(peg);

            // Calcular valoración
            const valuationColor = peg < 1.0 ? '#4ade80' : peg <= 2.0 ? '#fbbf24' : '#ef4444';
            const valuationEmoji = peg < 1.0 ? '🟢' : peg <= 2.0 ? '🟡' : '🔴';

            // Criterios Nivel 1
            const l1Criteria = [
                { name: 'Deuda/Equity', value: company.debtToEquity, threshold: '< 1.5', passed: company.debtToEquity < 1.5 },
                { name: 'Margen Neto', value: `${company.netProfitMargin.toFixed(1)}%`, threshold: '> 5%', passed: company.netProfitMargin > 5 },
                { name: 'Crecimiento', value: `${company.revenueGrowthYoY.toFixed(1)}%`, threshold: '> 5%', passed: company.revenueGrowthYoY > 5 },
                { name: 'Current Ratio', value: company.currentRatio.toFixed(2), threshold: '> 1.0', passed: company.currentRatio > 1.0 },
                { name: 'P/E vs Sector', value: `${company.peRatio.toFixed(1)} vs ${company.sectorAvgPE}`, threshold: '< Sector', passed: company.peRatio < company.sectorAvgPE },
            ];

            // Criterios Nivel 2
            const l2Criteria = [
                { name: 'ROE (Return on Equity)', value: company.roic > 0 ? `${company.roic.toFixed(1)}%` : '⚠️ No disponible', threshold: '> 10%', passed: company.roic > 10 },
                { name: 'Margen Operativo', value: company.operatingMarginTrend, threshold: 'up/flat', passed: company.operatingMarginTrend === 'up' || company.operatingMarginTrend === 'flat' },
                { name: 'Free Cash Flow', value: `$${(company.freeCashFlow / 1e9).toFixed(1)}B`, threshold: '> 0', passed: company.freeCashFlow > 0 },
                { name: 'Liquidez Inmediata (Quick Ratio)', value: company.quickRatio ? `${company.quickRatio.toFixed(2)}` : '—', threshold: '> 1.0', passed: company.quickRatio ? company.quickRatio > 1.0 : false },
            ];

            let html = `
                <div class="modal-content">
                    <h2 style="margin-bottom:5px">${company.ticker} - ${company.name}</h2>
                    <p style="color:#94a3b8;font-size:12px;margin-bottom:15px">Precio: $${company.price.toFixed(2)} USD | ${company.sector}</p>

                    <div style="background:${valuationColor}33;border-left:3px solid ${valuationColor};padding:12px;border-radius:4px;margin-bottom:15px">
                        <div style="color:${valuationColor};font-weight:bold;font-size:14px;margin-bottom:8px">${valuationEmoji} VALUACIÓN</div>
                        <div style="color:#cbd5e1;font-size:13px;line-height:1.6">
                            <strong>PEG Ratio = P/E ÷ Crecimiento</strong><br>
                            ${company.peRatio.toFixed(1)} ÷ ${company.revenueGrowthYoY.toFixed(1)}% = <strong style="color:${valuationColor}">${peg.toFixed(2)}</strong>
                        </div>
                        <div style="color:#94a3b8;font-size:11px;margin-top:8px">
                            ${peg < 1.0 ? '✓ BARATA: Precio bajo relativo a crecimiento futuro' : peg <= 2.0 ? '≈ JUSTA: Precio razonable' : '✗ CARA: Precio alto relativo a crecimiento'}
                        </div>
                    </div>

                    <h3 style="color:#60a5fa;font-size:13px;margin:15px 0 10px 0">📋 NIVEL 1: Criterios Básicos</h3>
                    <div style="background:#0f172a;padding:10px;border-radius:4px;font-size:12px;line-height:2">
                        ${l1Criteria.map(c => `
                            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding:6px 0">
                                <span>${c.passed ? '🟢' : '🔴'} ${c.name}</span>
                                <span style="color:#94a3b8">${c.value} <span style="color:#64748b">(${c.threshold})</span></span>
                            </div>
                        `).join('')}
                        <div style="margin-top:8px;color:#4ade80;font-weight:bold">
                            ${l1.passed ? '✓ PASA NIVEL 1' : '✗ NO PASA'} - ${l1.score}%
                        </div>
                    </div>

                    <h3 style="color:#60a5fa;font-size:13px;margin:15px 0 10px 0">🔍 NIVEL 2: Criterios Avanzados</h3>
                    <div style="background:#0f172a;padding:10px;border-radius:4px;font-size:12px;line-height:2">
                        ${l2Criteria.map(c => `
                            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding:6px 0">
                                <span>${c.passed ? '🟢' : '🔴'} ${c.name}</span>
                                <span style="color:#94a3b8">${c.value} <span style="color:#64748b">(${c.threshold})</span></span>
                            </div>
                        `).join('')}
                        <div style="margin-top:8px;color:${l2.passed ? '#4ade80' : '#ef4444'};font-weight:bold">
                            ${l2.passed ? '✓ PASA NIVEL 2' : '✗ NO PASA'} - ${l2.score}%
                        </div>
                    </div>

                    <h3 style="color:#60a5fa;font-size:13px;margin:15px 0 10px 0">⭐ INDICADORES OPCIONALES (Nivel 3)</h3>
                    <div style="background:#0f172a;padding:10px;border-radius:4px;font-size:12px;line-height:1.8">
                        <div>Dividendo: <strong>${company.dividendYield.toFixed(2)}%</strong></div>
                        <div>Posición: <strong>${company.competitiveness}</strong></div>
                        <div>Tendencia Deuda: <strong>${company.debtTrend}</strong></div>
                        <div style="margin-top:8px;color:#4ade80;font-weight:bold">Score L3: ${l3}%</div>
                    </div>

                    <div style="background:#1e293b;padding:10px;border-radius:4px;margin-top:15px;border-left:2px solid #8b5cf6">
                        <p style="color:#cbd5e1;font-size:11px;line-height:1.6;margin:0">
                            <strong style="color:#8b5cf6">📌 Recomendación:</strong>
                            ${l1.passed && l2.passed && peg < 1.0 ? '🟢 BUENA CANDIDATA - Pasa ambos niveles y está barata. Verifica en Charles Schwab disponibilidad de ADR.' : l1.passed && l2.passed ? '🟡 BUENA PERO CARA - Empresas sanas pero a precio premium. Espera a que caiga.' : '🔴 NO CALIFICA - No pasa todos los criterios.'}
                        </p>
                    </div>

                    <button class="close-modal" onclick="document.getElementById('modal').classList.remove('active')">Cerrar</button>
                </div>
            `;

            document.getElementById('modal').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        // Iniciar
        loadData();

        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then((registration) => {
                    console.log('[Analyzer] Service Worker registered:', registration.scope);
                })
                .catch((error) => {
                    console.error('[Analyzer] Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
