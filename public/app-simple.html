<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #4ade80; font-size: 32px; margin-bottom: 10px; }
        h2 { color: #60a5fa; font-size: 18px; margin: 20px 0 10px 0; }
        button {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #059669; }
        .market-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Load handlers FIRST -->
    <script src="level2.3-handler.js"></script>
    <script src="level2.7-handler.js"></script>
    <script src="level3.5-handler.js"></script>

    <script>
        // Global variables
        window.appData = null;
        window.currentMarket = null;

        // Load and initialize
        async function init() {
            try {
                const response = await fetch('./data.json');
                window.appData = await response.json();
                console.log('✅ appData cargado:', window.appData.markets);
                showStart();
            } catch (error) {
                document.getElementById('app').innerHTML = '<h1>Error: ' + error.message + '</h1>';
            }
        }

        function showStart() {
            const html = `
                <div class="container">
                    <h1>📊 Stock Analyzer</h1>

                    <h2>💡 Estrategias de Inversión</h2>

                    <p>🚀 Peter Lynch - GARP</p>
                    <div class="market-grid">
                        <button onclick="showLynchAnalysis('Brazil')">🇧🇷 Brasil</button>
                        <button onclick="showLynchAnalysis('India')">🇮🇳 India</button>
                        <button onclick="showLynchAnalysis('USA')">🇺🇸 USA</button>
                    </div>

                    <p>💰 Benjamin Graham - Dividendos</p>
                    <div class="market-grid">
                        <button onclick="showGrahamAnalysis('Brazil')">🇧🇷 Brasil</button>
                        <button onclick="showGrahamAnalysis('India')">🇮🇳 India</button>
                        <button onclick="showGrahamAnalysis('USA')">🇺🇸 USA</button>
                    </div>

                    <p>📈 Warren Buffett - Análisis Profundo</p>
                    <div class="market-grid">
                        <button onclick="showBuffettAnalysis('Brazil')">🇧🇷 Brasil</button>
                        <button onclick="showBuffettAnalysis('India')">🇮🇳 India</button>
                        <button onclick="showBuffettAnalysis('USA')">🇺🇸 USA</button>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
