<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Stock Analyzer</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #4ade80; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 12px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #1e293b; color: #4ade80; }
        tr:hover { background: #334155; }
        .pass { background: #064e3b; }
        .fail { background: #7c2d12; }
        .warning { background: #3a2a1a; }
        button { background: #10b981; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 10px 5px 10px 0; }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 DEBUG - Revisión de Cálculos</h1>
        <div id="controls">
            <button onclick="debugMarket('USA')">USA</button>
            <button onclick="debugMarket('Brazil')">Brasil</button>
            <button onclick="debugMarket('India')">India</button>
        </div>
        <div id="results"></div>
    </div>

    <script src="level2.3-handler.js"></script>
    <script src="level2.7-handler.js"></script>
    <script src="level3.5-handler.js"></script>

    <script>
        let appData = null;

        async function init() {
            const response = await fetch('./data.json');
            appData = await response.json();
        }

        function debugMarket(market) {
            const companies = appData.markets[market].companies;

            let html = `<h2>📊 ${market} - Análisis Detallado de Cada Empresa</h2>`;
            html += `<p style="color: #cbd5e1; font-size: 14px;">Total: ${companies.length} empresas</p>`;

            html += `<table>
                <thead>
                    <tr>
                        <th>Ticker</th>
                        <th>LYNCH Score</th>
                        <th>PEG</th>
                        <th>Pasa Lynch?</th>
                        <th>GRAHAM Score</th>
                        <th>Dividend</th>
                        <th>Pasa Graham?</th>
                        <th>BUFFETT Score</th>
                        <th>Pasa Buffett?</th>
                        <th>Consenso</th>
                        <th>Total Score</th>
                    </tr>
                </thead>
                <tbody>`;

            companies.forEach(c => {
                const lynch = window.evaluateLynchScore(c);
                const graham = window.evaluateGrahamDividend(c);
                const buffett = window.evaluateBuffettScore(c);

                const passLynch = lynch.pegRatio < 1.5 && lynch.score >= 80;
                const passGraham = graham.dividend >= 3 && graham.score >= 80;
                const passBuffett = buffett.buffettScore >= 65;

                let totalScore = 0;
                let consensusCount = 0;
                if (passLynch) { totalScore += lynch.score; consensusCount++; }
                if (passGraham) { totalScore += graham.score; consensusCount++; }
                if (passBuffett) { totalScore += buffett.buffettScore; consensusCount++; }

                const rowClass = consensusCount === 3 ? 'pass' : consensusCount === 2 ? 'warning' : consensusCount === 1 ? 'warning' : 'fail';

                html += `<tr class="${rowClass}">
                    <td><strong>${c.ticker}</strong></td>
                    <td>${lynch.score}</td>
                    <td>${lynch.pegRatio.toFixed(2)}</td>
                    <td>${passLynch ? '✅ SI' : '❌ NO'}</td>
                    <td>${graham.score}</td>
                    <td>${graham.dividend.toFixed(2)}%</td>
                    <td>${passGraham ? '✅ SI' : '❌ NO'}</td>
                    <td>${buffett.buffettScore}</td>
                    <td>${passBuffett ? '✅ SI' : '❌ NO'}</td>
                    <td>${consensusCount}/3</td>
                    <td><strong>${totalScore}/${consensusCount * 100}</strong></td>
                </tr>`;
            });

            html += `</tbody></table>`;

            // Estadísticas
            const stats = companies.reduce((acc, c) => {
                const lynch = window.evaluateLynchScore(c);
                const graham = window.evaluateGrahamDividend(c);
                const buffett = window.evaluateBuffettScore(c);

                const passLynch = lynch.pegRatio < 1.5 && lynch.score >= 80;
                const passGraham = graham.dividend >= 3 && graham.score >= 80;
                const passBuffett = buffett.buffettScore >= 65;

                const consensus = [passLynch, passGraham, passBuffett].filter(Boolean).length;

                return {
                    consensus3: acc.consensus3 + (consensus === 3 ? 1 : 0),
                    consensus2: acc.consensus2 + (consensus === 2 ? 1 : 0),
                    consensus1: acc.consensus1 + (consensus === 1 ? 1 : 0),
                    consensus0: acc.consensus0 + (consensus === 0 ? 1 : 0)
                };
            }, { consensus3: 0, consensus2: 0, consensus1: 0, consensus0: 0 });

            html += `<h3 style="color: #60a5fa; margin-top: 30px;">📊 Resumen</h3>`;
            html += `<p>🟢 Consenso 3/3: <strong>${stats.consensus3}</strong> empresas</p>`;
            html += `<p>🟡 Consenso 2/3: <strong>${stats.consensus2}</strong> empresas</p>`;
            html += `<p>🟠 Consenso 1/3: <strong>${stats.consensus1}</strong> empresas</p>`;
            html += `<p>⚪ Sin consenso (0/3): <strong>${stats.consensus0}</strong> empresas</p>`;

            document.getElementById('results').innerHTML = html;
        }

        init().then(() => debugMarket('USA'));
    </script>
</body>
</html>
